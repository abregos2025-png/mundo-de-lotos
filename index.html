<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06151d">
<meta name="description" content="Pantano nocturno con estrellas, luciérnagas, agua serena, flores de loto y música ambiental lenta.">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06151d}
#world{position:fixed;inset:0;overflow:hidden}
#scene{display:block;width:100%;height:100%;touch-action:manipulation}
.controls{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px}
.control{display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid #dcefd433;border-radius:50%;color:#e4eccd;background:#05181e80;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.control:active{transform:scale(.95)}
.control svg{width:19px;height:19px}
@media(max-width:600px){.control{width:39px;height:39px}}
</style>
</head>
<body>
<main id="world" aria-label="Pantano nocturno">
<canvas id="scene" aria-label="Un pantano con estrellas, luciérnagas y flores de loto"></canvas>
<div class="controls">
<button class="control" id="soundBtn" aria-label="Activar música y sonidos nocturnos" title="Música y sonidos nocturnos">
<svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<button class="control" id="fullBtn" aria-label="Pantalla completa" title="Pantalla completa">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/></svg>
</button>
</div>
</main>

<script>
(()=>{
'use strict';

const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false});
const soundBtn=document.getElementById('soundBtn');
const soundIcon=document.getElementById('soundIcon');

let w=0,h=0,dpr=1,H=0,S=1;
let stars=[],flies=[],pads=[],lotuses=[],reedItems=[],trees=[],ripples=[];
let audio=null,audioOn=false,timer=null,note=0,last=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);

function setup(){
 w=innerWidth;
 h=innerHeight;
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(w*dpr);
 canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 H=h*.47;
 S=Math.min(w,h);

 stars=Array.from({
  length:Math.max(90,Math.min(240,Math.floor(w*h/6000)))
 },()=>({
  x:Math.random(),
  y:Math.random()*.53,
  r:rnd(.45,1.7),
  a:rnd(.3,.95),
  p:rnd(0,7),
  speed:rnd(.3,1.6),
  cross:Math.random()<.09
 }));

 flies=Array.from({
  length:Math.max(22,Math.min(60,Math.floor(w/20)))
 },()=>({
  x:rnd(0,1),y:rnd(.4,1),
  r:rnd(1,2.4),p:rnd(0,7),
  speed:rnd(.5,1.5)
 }));

 pads=[];
 lotuses=[];
 reedItems=[];
 trees=[];

 for(let i=0;i<Math.max(18,Math.floor(w/42));i++){
  let x=(i+Math.random()*.7)/Math.max(18,Math.floor(w/42));
  let y=rnd(.46,.64);
  pads.push({
   x,y,rx:rnd(.009,.021),ry:rnd(.004,.009),
   rot:rnd(-.4,.4),far:true
  });
  if(Math.random()<.42)lotuses.push({
   x:x+rnd(-.009,.009),
   y:y-rnd(.004,.012),
   size:rnd(.13,.23),p:rnd(0,7),tone:Math.random()
  });
 }

 for(let i=0;i<Math.max(32,Math.floor(w/20));i++){
  let x=rnd(-.04,1.04),y=rnd(.65,1.06);
  pads.push({
   x,y,rx:rnd(.014,.042),ry:rnd(.006,.018),
   rot:rnd(-.5,.5),far:false,tone:Math.random()
  });
  if(Math.random()<.62)lotuses.push({
   x:x+rnd(-.014,.014),
   y:y-rnd(.008,.025),
   size:rnd(.25,.48),p:rnd(0,7),tone:Math.random()
  });
 }

 for(let i=0;i<Math.max(35,Math.floor(w/13));i++){
  reedItems.push({
   x:Math.random(),base:rnd(.59,1.08),
   len:rnd(.025,.16),bend:rnd(-.02,.02),
   p:rnd(0,7),thick:rnd(.7,2)
  });
 }

 for(let l=0;l<3;l++){
  let pts=[],n=Math.max(28,Math.floor(w/15));
  for(let i=0;i<=n;i++){
   pts.push({x:i/n,y:.385+l*.025+rnd(-.025,.035)});
  }
  trees.push({
   pts,color:['#0a252d','#092128','#071b22'][l],depth:l
  });
 }
}

function glow(x,y,r,inside,outside){
 let g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,inside);
 g.addColorStop(1,outside);
 return g;
}

function sky(t){
 let g=ctx.createLinearGradient(0,0,0,h);
 g.addColorStop(0,'#020713');
 g.addColorStop(.38,'#071924');
 g.addColorStop(.68,'#12343a');
 g.addColorStop(1,'#071c25');
 ctx.fillStyle=g;
 ctx.fillRect(0,0,w,h);

 ctx.fillStyle=glow(
  w*.77,h*.19,S*.42,
  'rgba(83,127,137,.19)','rgba(33,64,77,0)'
 );
 ctx.fillRect(0,0,w,h*.75);

 for(const s of stars){
  let a=s.a*(reduced?.75:(.57+.43*Math.sin(t*.001*s.speed+s.p)));
  ctx.globalAlpha=a;
  ctx.fillStyle=s.cross?'#f3efce':'#d9e9e6';
  ctx.beginPath();
  ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);
  ctx.fill();

  if(s.cross&&s.r>1.15){
   ctx.globalAlpha=a*.42;
   ctx.strokeStyle='#e9f0da';
   ctx.lineWidth=.6;
   ctx.beginPath();
   ctx.moveTo(s.x*w-3,s.y*h);
   ctx.lineTo(s.x*w+3,s.y*h);
   ctx.moveTo(s.x*w,s.y*h-3);
   ctx.lineTo(s.x*w,s.y*h+3);
   ctx.stroke();
  }
 }

 ctx.globalAlpha=1;
 let mx=w*.77,my=h*.19,mr=S*.047;

 ctx.fillStyle=glow(
  mx,my,mr*5.5,
  'rgba(205,222,191,.13)','rgba(205,222,191,0)'
 );
 ctx.beginPath();
 ctx.arc(mx,my,mr*5.5,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#e4e8d0';
 ctx.beginPath();
 ctx.arc(mx,my,mr,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#b6c7bf';
 ctx.globalAlpha=.22;
 ctx.beginPath();
 ctx.arc(mx-mr*.2,my-mr*.18,mr*.18,0,Math.PI*2);
 ctx.arc(mx+mr*.27,my+mr*.22,mr*.12,0,Math.PI*2);
 ctx.fill();
 ctx.globalAlpha=1;

 // Ramas oscuras enmarcan el cielo sin cubrir las estrellas.
 ctx.strokeStyle='#06171d';
 ctx.lineCap='round';

 for(let side=0;side<2;side++){
  let x=side?w:0,d=side?-1:1;
  ctx.lineWidth=Math.max(3,S*.008);
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.bezierCurveTo(
   x+d*w*.09,h*.035,
   x+d*w*.1,h*.11,
   x+d*w*.16,h*.14
  );
  ctx.stroke();

  for(let j=0;j<7;j++){
   let bx=x+d*w*(.035+j*.018);
   let by=h*(.035+(j%4)*.028);
   ctx.lineWidth=1.5;
   ctx.beginPath();
   ctx.moveTo(bx,by);
   ctx.quadraticCurveTo(
    bx+d*15,by+13,bx+d*25,by+28
   );
   ctx.stroke();
  }
 }
}

function water(t){
 let g=ctx.createLinearGradient(0,H,0,h);
 g.addColorStop(0,'#102f35');
 g.addColorStop(.25,'#0a292f');
 g.addColorStop(.65,'#071e27');
 g.addColorStop(1,'#041319');
 ctx.fillStyle=g;
 ctx.fillRect(0,H,w,h-H);

 let mx=w*.77;
 let rg=ctx.createLinearGradient(mx,H,mx,h);
 rg.addColorStop(0,'rgba(197,218,190,.24)');
 rg.addColorStop(.28,'rgba(157,196,174,.12)');
 rg.addColorStop(1,'rgba(96,142,132,0)');

 ctx.fillStyle=rg;
 ctx.beginPath();
 ctx.moveTo(mx-w*.025,H);
 ctx.lineTo(mx+w*.025,H);
 ctx.lineTo(mx+w*.105,h);
 ctx.lineTo(mx-w*.105,h);
 ctx.closePath();
 ctx.fill();

 for(let i=0;i<90;i++){
  let y=H+Math.pow(i/90,1.65)*h*.57;
  let shift=reduced?0:Math.sin(t*.001+i*2.7)*5;
  let spread=(y-H)*.72+6;
  let shimmer=.72+.28*Math.sin(t*.0007+i*1.73);
  let a=(1-i/100)*(.035+(i%7)*.006)*shimmer;
  let half=spread*(.22+(i%5)*.11);

  ctx.strokeStyle=`rgba(193,216,190,${a})`;
  ctx.lineWidth=.55+(i%3)*.22;
  ctx.beginPath();
  ctx.moveTo(mx+shift-half,y);
  ctx.lineTo(mx+shift+half,y);
  ctx.stroke();
 }

 for(let b=0;b<4;b++){
  let y=h*(.49+b*.085);
  let d=reduced?0:Math.sin(t*.00012+b*2)*w*.045;
  ctx.fillStyle=glow(
   w*.45+d,y,w*.42,
   'rgba(151,184,166,.055)','rgba(151,184,166,0)'
  );
  ctx.fillRect(0,y-h*.045,w,h*.09);
 }
}

function treeLine(t){
 let base=H+h*.025;
 for(const layer of trees){
  ctx.fillStyle=layer.color;
  ctx.beginPath();
  ctx.moveTo(0,base);

  layer.pts.forEach((p,i)=>{
   let x=p.x*w;
   let y=p.y*h+Math.sin(
    t*.00015+i*.7+layer.depth
   )*(reduced?0:1.5);

   if(i===0)ctx.lineTo(x,y);
   else{
    let q=layer.pts[i-1];
    ctx.lineTo(
     (q.x+p.x)*.5*w,
     Math.min(q.y,p.y)*h-h*.008
    );
    ctx.lineTo(x,y);
   }
  });

  ctx.lineTo(w,base);
  ctx.closePath();
  ctx.fill();
 }
}

function pad(p,t){
 let x=p.x*w,y=p.y*h;
 let rx=p.rx*S*2.1,ry=p.ry*S*2;
 let b=reduced?0:Math.sin(t*.001+p.rot*8+p.x*20)*1.3;

 ctx.save();
 ctx.translate(x,y+b);
 ctx.rotate(p.rot);

 ctx.fillStyle=p.far?'#1a4a45':
  p.tone>.5?'#174b40':'#1b5146';

 ctx.beginPath();
 ctx.ellipse(0,0,rx,ry,0,.08,Math.PI*2-.12);
 ctx.lineTo(0,0);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle=p.far?
  'rgba(139,183,142,.16)':'rgba(138,190,139,.24)';
 ctx.lineWidth=Math.max(.5,S*.0013);
 ctx.beginPath();
 ctx.ellipse(0,0,rx*.82,ry*.76,0,.3,Math.PI*1.85);
 ctx.stroke();

 ctx.fillStyle='#0b2b31';
 ctx.beginPath();
 ctx.moveTo(rx*.95,-ry*.04);
 ctx.lineTo(rx*.48,-ry*.21);
 ctx.lineTo(rx*.55,ry*.13);
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

function lotus(f,t){
 let x=f.x*w,y=f.y*h,z=f.size*S*.31;
 let sway=reduced?0:Math.sin(t*.0012+f.p)*z*.045;
 let depth=Math.max(.42,Math.min(1,(f.y-.38)/.55));

 ctx.save();
 ctx.translate(x+sway,y);
 ctx.scale(depth,depth);

 ctx.globalAlpha=.13;
 ctx.fillStyle='#e3afc6';
 ctx.beginPath();
 ctx.ellipse(0,z*.48,z*.68,z*.15,0,0,Math.PI*2);
 ctx.fill();
 ctx.globalAlpha=1;

 for(let i=0;i<9;i++){
  let a=i/9*Math.PI*2-Math.PI/2;
  let len=z*(i%2?.72:.92);

  ctx.save();
  ctx.translate(Math.cos(a)*z*.29,Math.sin(a)*z*.23);
  ctx.rotate(a+Math.PI/2);

  let g=ctx.createLinearGradient(0,-len*.45,0,len*.62);

  if(f.tone<.22){
   g.addColorStop(0,'#fff0d7');
   g.addColorStop(.55,'#f2d1dc');
   g.addColorStop(1,'#cc8ba9');
  }else{
   g.addColorStop(0,'#fff0ef');
   g.addColorStop(.5,'#eab1cf');
   g.addColorStop(1,'#b86191');
  }

  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,len*.6);
  ctx.bezierCurveTo(
   -z*.26,len*.23,-z*.24,-len*.34,0,-len*.52
  );
  ctx.bezierCurveTo(
   z*.23,-len*.32,z*.25,len*.25,0,len*.6
  );
  ctx.fill();

  ctx.strokeStyle='rgba(255,236,231,.24)';
  ctx.lineWidth=Math.max(.45,z*.012);
  ctx.stroke();
  ctx.restore();
 }

 ctx.fillStyle='#d8c88d';
 ctx.beginPath();
 ctx.arc(0,0,z*.14,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#f4e4a9';
 for(let i=0;i<7;i++){
  let a=i*2.399;
  ctx.beginPath();
  ctx.arc(Math.cos(a)*z*.1,Math.sin(a)*z*.1,z*.025,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}

function drawReeds(t){
 for(const r of reedItems){
  let x=r.x*w,base=r.base*h,len=r.len*h;
  let sw=reduced?0:Math.sin(t*.0008+r.p)*w*.005;

  ctx.strokeStyle='#123a34';
  ctx.lineWidth=r.thick;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x,base);
  ctx.quadraticCurveTo(
   x+sw*.45,base-len*.55,
   x+sw+r.bend*w,base-len
  );
  ctx.stroke();

  if(r.len>.075){
   ctx.fillStyle='#21473b';
   ctx.beginPath();
   ctx.ellipse(
    x+sw+r.bend*w,base-len,
    r.thick*1.5,len*.055,-.22,0,Math.PI*2
   );
   ctx.fill();
  }
 }

 let g=ctx.createLinearGradient(0,h*.84,0,h);
 g.addColorStop(0,'rgba(5,25,25,0)');
 g.addColorStop(.22,'rgba(4,20,20,.48)');
 g.addColorStop(1,'rgba(2,12,15,.96)');
 ctx.fillStyle=g;
 ctx.fillRect(0,h*.82,w,h*.18);
}

function fireflies(t){
 for(const f of flies){
  let x=f.x*w+(reduced?0:
   Math.sin(t*.00022*f.speed+f.p)*w*.012);
  let y=f.y*h+(reduced?0:
   Math.cos(t*.00031*f.speed+f.p)*h*.009);
  let a=.18+.82*(.5+.5*Math.sin(t*.002*f.speed+f.p));

  ctx.globalAlpha=a*.5;
  ctx.fillStyle=glow(
   x,y,f.r*7,'rgba(191,231,133,.5)','rgba(191,231,133,0)'
  );
  ctx.beginPath();
  ctx.arc(x,y,f.r*7,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=a;
  ctx.fillStyle='#e1f1a7';
  ctx.beginPath();
  ctx.arc(x,y,f.r*.7,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
}

function ripple(t){
 ripples=ripples.filter(r=>t-r.t<1900);

 for(const r of ripples){
  let p=(t-r.t)/1900,rad=p*S*.105;
  ctx.globalAlpha=(1-p)*.45;
  ctx.strokeStyle='#bbdcca';
  ctx.lineWidth=1;

  for(let k=0;k<2;k++){
   ctx.beginPath();
   ctx.ellipse(
    r.x,r.y,rad*(1+k*.48),rad*(.19+k*.045),
    0,0,Math.PI*2
   );
   ctx.stroke();
  }
 }
 ctx.globalAlpha=1;
}

function frame(t){
 if(!last)last=t;
 last=t;

 sky(t);
 water(t);
 treeLine(t);

 pads.slice().sort((a,b)=>a.y-b.y).forEach(p=>pad(p,t));
 lotuses.slice().sort((a,b)=>a.y-b.y).forEach(f=>lotus(f,t));

 drawReeds(t);
 fireflies(t);
 ripple(t);

 let v=ctx.createRadialGradient(
  w*.5,h*.48,S*.18,w*.5,h*.48,Math.max(w,h)*.77
 );
 v.addColorStop(0,'rgba(0,0,0,0)');
 v.addColorStop(1,'rgba(0,6,12,.42)');
 ctx.fillStyle=v;
 ctx.fillRect(0,0,w,h);

 requestAnimationFrame(frame);
}

/* Música original lenta y sonidos nocturnos, creados con el navegador. */
function startAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;

 const ac=new AC();
 const master=ac.createGain();
 const music=ac.createGain();
 const amb=ac.createGain();

 master.gain.value=.0001;
 music.gain.value=.62;
 amb.gain.value=.22;
 music.connect(master);
 amb.connect(master);
 master.connect(ac.destination);

 // Sonido tenue de agua y brisa.
 let buf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
 let data=buf.getChannelData(0),brown=0;

 for(let i=0;i<data.length;i++){
  brown=(brown+(Math.random()*2-1)*.018)/1.018;
  data[i]=brown*3.2;
 }

 let noise=ac.createBufferSource();
 let low=ac.createBiquadFilter();
 let wg=ac.createGain();

 noise.buffer=buf;
 noise.loop=true;
 low.type='lowpass';
 low.frequency.value=430;
 wg.gain.value=.33;

 noise.connect(low);
 low.connect(wg);
 wg.connect(amb);
 noise.start();

 // Insectos nocturnos muy suaves.
 let insect=ac.createOscillator();
 let ig=ac.createGain();
 let lfo=ac.createOscillator();
 let depth=ac.createGain();

 insect.type='sine';
 insect.frequency.value=3900;
 ig.gain.value=.00035;
 insect.connect(ig);
 ig.connect(amb);
 insect.start();

 lfo.frequency.value=.21;
 depth.gain.value=.00022;
 lfo.connect(depth);
 depth.connect(ig.gain);
 lfo.start();

 return{ac,master,music,amb};
}

function playNote(){
 if(!audio||!audioOn||audio.ac.state!=='running')return;

 let ac=audio.ac,now=ac.currentTime;
 let notes=[
  146.83,174.61,220,196,164.81,130.81,
  174.61,220,196,164.81,146.83,130.81
 ];
 let freq=notes[note++%notes.length];
 let osc=ac.createOscillator();
 let g=ac.createGain();
 let filter=ac.createBiquadFilter();

 osc.type='sine';
 osc.frequency.value=freq;
 filter.type='lowpass';
 filter.frequency.value=1000;

 g.gain.setValueAtTime(.0001,now);
 g.gain.linearRampToValueAtTime(.12,now+1.3);
 g.gain.setTargetAtTime(.0001,now+2.1,1);

 osc.connect(filter);
 filter.connect(g);
 g.connect(audio.music);
 osc.start(now);
 osc.stop(now+5.2);

 // Campanita lejana sobre la melodía.
 if(note%2===0){
  let bell=ac.createOscillator();
  let bg=ac.createGain();

  bell.type='sine';
  bell.frequency.value=freq*2.01;
  bg.gain.setValueAtTime(.0001,now);
  bg.gain.linearRampToValueAtTime(.022,now+.75);
  bg.gain.exponentialRampToValueAtTime(.0001,now+4.4);

  bell.connect(bg);
  bg.connect(audio.music);
  bell.start(now);
  bell.stop(now+4.5);
 }
}

async function toggleSound(){
 if(!audio){
  audio=startAudio();
  if(!audio)return;
 }

 try{
  if(audio.ac.state==='suspended')await audio.ac.resume();

  audioOn=!audioOn;
  let now=audio.ac.currentTime;

  audio.master.gain.cancelScheduledValues(now);
  audio.master.gain.setTargetAtTime(
   audioOn ? .72 : .0001,
   now,
   audioOn ? .8 : .25
  );

  if(audioOn){
   if(!timer){
    playNote();
    timer=setInterval(playNote,3900);
   }

   soundBtn.setAttribute(
    'aria-label','Pausar música y sonidos nocturnos'
   );

   soundIcon.innerHTML=
    '<path d="M4 10v4h4l5 4V6l-5 4H4z"/>'+
    '<path d="M16 9.5a4 4 0 0 1 0 5"/>'+
    '<path d="M18.5 7a7.5 7.5 0 0 1 0 10"/>';
  }else{
   clearInterval(timer);
   timer=null;

   soundBtn.setAttribute(
    'aria-label','Activar música y sonidos nocturnos'
   );

   soundIcon.innerHTML=
    '<path d="M4 10v4h4l5 4V6l-5 4H4z"/>'+
    '<path d="M17 9l5 6M22 9l-5 6"/>';
  }
 }catch(e){}
}

canvas.addEventListener('pointerdown',e=>{
 let r=canvas.getBoundingClientRect();
 let x=e.clientX-r.left;
 let y=e.clientY-r.top;

 ripples.push({x,y:Math.max(H,y),t:performance.now()});
},{passive:true});

soundBtn.addEventListener('click',toggleSound);

document.getElementById('fullBtn').addEventListener('click',async()=>{
 try{
  if(!document.fullscreenElement){
   await document.getElementById('world').requestFullscreen();
  }else{
   await document.exitFullscreen();
  }
 }catch(e){}
});

document.addEventListener('visibilitychange',()=>{
 if(!audio)return;

 if(document.hidden&&audio.ac.state==='running'){
  audio.ac.suspend();
 }else if(!document.hidden&&audioOn&&audio.ac.state==='suspended'){
  audio.ac.resume();
 }
});

addEventListener('resize',setup,{passive:true});
setup();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
