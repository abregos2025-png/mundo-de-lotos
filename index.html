<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102f2d">
<meta name="description" content="Un pantano mágico para explorar entre flores de loto, agua serena, senderos vegetales y montañas con niebla.">
<title>El Pantano de los Lotos</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f4f4dd;
    --glass: rgba(11,35,32,.58);
    --line: rgba(231,246,209,.22);
    --mint: #c4e8b9;
    --gold: #f5d89c;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #102f2d;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
  }

  body {
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: rgba(14,43,39,.58);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background .25s, border-color .25s, transform .25s;
  }

  button:hover {
    background: rgba(58,104,76,.78);
    border-color: rgba(241,244,205,.5);
  }

  button:active {
    transform: scale(.97);
  }

  #world {
    position: relative;
    width: 100%;
    height: 100%;
    isolation: isolate;
    background: #163d39;
    overflow: hidden;
  }

  #landscape {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: pan-y;
    cursor: grab;
  }

  #landscape.dragging {
    cursor: grabbing;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: linear-gradient(
      180deg,
      rgba(7,26,28,.26),
      transparent 24%,
      transparent 61%,
      rgba(4,23,22,.32)
    );
  }

  .topbar {
    position: absolute;
    z-index: 5;
    top: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    pointer-events: none;
  }

  .identity {
    max-width: min(460px,58vw);
    padding: 8px 0 7px 15px;
    border-left: 1px solid rgba(221,239,188,.7);
    text-shadow: 0 3px 20px #071e1e;
  }

  .eyebrow {
    font: 600 10px/1.2 system-ui,sans-serif;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #cfdfb5;
    margin-bottom: 7px;
  }

  h1 {
    font-weight: 400;
    font-size: clamp(24px,3.2vw,43px);
    line-height: 1;
    margin: 0 0 8px;
  }

  .subtitle {
    font: 400 clamp(11px,1.2vw,14px)/1.4 system-ui,sans-serif;
    color: #e0e9cf;
  }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    pointer-events: auto;
    max-width: 54vw;
  }

  .control {
    border-radius: 999px;
    padding: 10px 14px;
    font: 500 11px/1 system-ui,sans-serif;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .control .symbol {
    font-size: 14px;
    color: #d7e9b7;
  }

  .bottom-ui {
    position: absolute;
    z-index: 5;
    left: 0;
    right: 0;
    bottom: 16px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 0 18px;
    pointer-events: none;
  }

  .hint {
    padding: 11px 14px;
    border-radius: 14px;
    background: rgba(10,34,31,.48);
    border: 1px solid rgba(231,246,209,.14);
    font: 11px/1.45 system-ui,sans-serif;
    max-width: 230px;
  }

  .hint strong {
    display: block;
    font-weight: 500;
    color: #f5e7b9;
    margin-bottom: 3px;
  }

  .navigation {
    display: flex;
    gap: 9px;
    pointer-events: auto;
  }

  .navbtn {
    width: 49px;
    height: 49px;
    border-radius: 50%;
    font-size: 22px;
    display: grid;
    place-items: center;
  }

  #progressFill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg,#a9d79e,#f2d9a8);
    transition: width .15s linear;
  }

  #startScrim {
    position: absolute;
    inset: 0;
    z-index: 9;
    display: grid;
    place-items: center;
    background: radial-gradient(
      ellipse at 50% 56%,
      rgba(13,45,39,.1),
      rgba(3,19,20,.43)
    );
    transition: opacity .8s, visibility .8s;
  }

  #startScrim.gone {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .start-content {
    max-width: 680px;
    text-align: center;
    padding: 34px 24px;
    text-shadow: 0 3px 24px #091d1c;
  }

  .start-title {
    font-weight: 400;
    font-size: clamp(39px,7vw,82px);
    line-height: .98;
    margin: 0 0 18px;
  }

  #enterBtn {
    border-radius: 999px;
    padding: 15px 25px;
    border-color: rgba(231,239,199,.48);
    font: 500 11px system-ui,sans-serif;
    letter-spacing: .15em;
    text-transform: uppercase;
    background: rgba(20,57,49,.72);
  }

  @keyframes mistDrift {
    from { transform: translateX(-2%); }
    to   { transform: translateX(3%); }
  }

  @keyframes glow {
    from { opacity: .28; }
    to   { opacity: 1; }
  }

  @media(max-width:660px) {
    .topbar {
      gap: 8px;
    }

    .identity {
      max-width: 57vw;
      padding-left: 10px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.02;
    }

    .controls {
      max-width: 43vw;
      gap: 5px;
    }

    .control {
      width: 39px;
      height: 39px;
      padding: 0;
      justify-content: center;
      font-size: 0;
    }

    .bottom-ui {
      align-items: flex-end;
    }

    .navbtn {
      width: 44px;
      height: 44px;
    }
  }
</style>
</head>
<body>
<main id="world" aria-label="El pantano de los lotos">
  <!-- El paisaje SVG y las funciones interactivas
       están incluidos en el archivo completo descargable. -->
</main>
</body>
</html>
